# 30분마다 기상청 예보를 받아 페이지와 함께 GitHub Pages 에 올립니다.
# 준비: Settings > Secrets and variables > Actions 에 KMA_KEY 등록,
#       Settings > Pages > Source 를 "GitHub Actions" 로 선택
name: 기상청 예보 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # 매시 7분·37분 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 기상청 예보 받기
        run: node scripts/fetch-kma.mjs
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
      - name: 골목 자료 캐시
        id: roads
        uses: actions/cache@v4
        with:
          path: data/roads.json
          key: roads-v1
      - name: 골목·경사 자료 만들기 (처음 한 번)
        if: steps.roads.outputs.cache-hit != 'true'
        run: node scripts/build-roads.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
